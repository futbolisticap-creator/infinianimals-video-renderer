name: InfiniAnimals Video Renderer

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "WordPress post ID"
        required: true
        type: string

      animal:
        description: "Animal name"
        required: true
        type: string

      script:
        description: "Narration script"
        required: true
        type: string

      article_url:
        description: "InfiniAnimals article URL"
        required: true
        type: string

      youtube_title:
        description: "Video title"
        required: false
        type: string

      media_type:
        description: "video or image"
        required: true
        type: string

      media_url:
        description: "Pexels media URL"
        required: true
        type: string

      creator_name:
        description: "Pexels creator"
        required: false
        type: string

      pexels_page:
        description: "Pexels source page"
        required: false
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    env:
      POST_ID: ${{ inputs.post_id }}
      ANIMAL: ${{ inputs.animal }}
      SCRIPT: ${{ inputs.script }}
      ARTICLE_URL: ${{ inputs.article_url }}
      VIDEO_TITLE: ${{ inputs.youtube_title }}

      MEDIA_TYPE: ${{ inputs.media_type }}
      MEDIA_URL: ${{ inputs.media_url }}

      CREATOR_NAME: ${{ inputs.creator_name }}
      PEXELS_PAGE: ${{ inputs.pexels_page }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
    
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl fonts-dejavu-core

      - name: Download Pexels media
        run: |

          echo "Media type: $MEDIA_TYPE"
          echo "Media URL: $MEDIA_URL"

          if [ -z "$MEDIA_URL" ]; then
            echo "No media URL received"
            exit 1
          fi

          if [ "$MEDIA_TYPE" = "video" ]; then

            curl -fL "$MEDIA_URL" -o media.mp4

          elif [ "$MEDIA_TYPE" = "image" ]; then

            curl -fL "$MEDIA_URL" -o media.jpg

          else

            echo "Unsupported media type: $MEDIA_TYPE"
            exit 1

          fi

      - name: Generate narration with Gemini
        run: |

          PROMPT="Narrate this as an energetic, natural wildlife documentary voice for a short social media video.

          Speak clearly and naturally.

          Read the following script exactly:

          $SCRIPT"

          jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "gemini-3.1-flash-tts-preview",
              input: $prompt,
              response_format: {
                type: "audio"
              },
              generation_config: {
                speech_config: [
                  {
                    voice: "Puck"
                  }
                ]
              }
            }' > request.json

          curl -fsS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/interactions" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > response.json

          jq -r \
            '.. | objects |
            select(.type? == "audio" and (.data? != null)) |
            .data' \
            response.json \
            | head -n 1 \
            > audio.b64

          if [ ! -s audio.b64 ]; then
            echo "Gemini did not return audio"
            cat response.json
            exit 1
          fi

          base64 -d audio.b64 > voice.pcm

          ffmpeg -y \
            -f s16le \
            -ar 24000 \
            -ac 1 \
            -i voice.pcm \
            voice.wav

      - name: Generate dynamic subtitles
        run: |
          cat > make_subtitles.py <<'PY'
          import os
          import re
          import subprocess

          script = os.environ.get("SCRIPT", "").strip()

          if not script:
              raise RuntimeError("SCRIPT is empty; cannot create subtitles")

          duration_raw = subprocess.check_output([
              "ffprobe",
              "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "voice.wav"
          ], text=True).strip()

          duration = float(duration_raw)

          # Split the exact narration into short TikTok/Reels-style blocks.
          tokens = re.findall(r"\S+", script)
          groups = []
          current = []

          for token in tokens:
              current.append(token)
              end_punctuation = bool(re.search(r"[.!?]$", token))

              if len(current) >= 4 or end_punctuation:
                  groups.append(current)
                  current = []

          if current:
              groups.append(current)

          if not groups:
              raise RuntimeError("No subtitle groups were created")

          # Estimate timing from the exact TTS duration. This guarantees that
          # captions exist even if speech-to-text alignment fails.
          def group_weight(group):
              weight = 0.0
              for word in group:
                  clean = re.sub(r"[^A-Za-z0-9']", "", word)
                  weight += 1.0 + max(0, len(clean) - 6) * 0.035
              if re.search(r"[.!?]$", group[-1]):
                  weight += 0.35
              elif re.search(r"[,;:]$", group[-1]):
                  weight += 0.18
              return weight

          weights = [group_weight(g) for g in groups]
          total_weight = sum(weights)

          # Keep a tiny safety margin at the start/end.
          start_margin = 0.08
          end_margin = 0.10
          usable = max(0.5, duration - start_margin - end_margin)

          def ass_time(seconds):
              seconds = max(0.0, seconds)
              hours = int(seconds // 3600)
              minutes = int((seconds % 3600) // 60)
              secs = seconds % 60
              return f"{hours}:{minutes:02d}:{secs:05.2f}"

          header = (
              "[Script Info]\n"
              "ScriptType: v4.00+\n"
              "PlayResX: 1080\n"
              "PlayResY: 1920\n"
              "WrapStyle: 2\n"
              "ScaledBorderAndShadow: yes\n"
              "\n"
              "[V4+ Styles]\n"
              "Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding\n"
              "Style: Shorts,DejaVu Sans,64,&H00FFFFFF,&H000000FF,&H00000000,&H50000000,-1,0,0,0,100,100,0,0,1,4,0,2,80,80,360,1\n"
              "\n"
              "[Events]\n"
              "Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text\n"
          )

          current_time = start_margin

          with open("subtitles.ass", "w", encoding="utf-8") as f:
              f.write(header)

              for i, (group, weight) in enumerate(zip(groups, weights)):
                  block_duration = usable * (weight / total_weight)
                  start = current_time
                  end = min(duration - end_margin, start + block_duration)

                  if i == len(groups) - 1:
                      end = duration - end_margin

                  text = " ".join(group).upper()
                  text = text.replace("{", "").replace("}", "")
                  text = text.replace("\\", "")

                  f.write(
                      f"Dialogue: 0,{ass_time(start)},{ass_time(end)},"
                      f"Shorts,,0,0,0,,{text}\n"
                  )

                  current_time = end

          print(f"Created {len(groups)} subtitle blocks for {duration:.2f}s narration")
          PY

          python make_subtitles.py

          echo "=== SUBTITLE PREVIEW ==="
          sed -n '1,35p' subtitles.ass

          if ! grep -q '^Dialogue:' subtitles.ass; then
            echo "No subtitle dialogue lines generated"
            exit 1
          fi

      - name: Prepare branding
        run: |

          printf '%s\n' "$ANIMAL" > animal.txt

          printf '%s\n' \
            "InfiniAnimals.com" \
            > website.txt

          printf '%s\n' \
            "Read the full animal guide" \
            > cta1.txt

          printf '%s\n' \
            "InfiniAnimals.com" \
            > cta2.txt

      - name: Get narration duration
        run: |

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.wav)

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"

          echo "Narration duration: $DURATION"

      - name: Create video from Pexels clip
        if: env.MEDIA_TYPE == 'video'
        run: |

          ffmpeg -y \
            -stream_loop -1 \
            -i media.mp4 \
            -i voice.wav \
            -filter_complex "
            [0:v]
            scale=1080:1920:force_original_aspect_ratio=increase,
            crop=1080:1920,
            ass=subtitles.ass,

            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=animal.txt:
              fontcolor=white:
              fontsize=54:
              box=1:
              boxcolor=black@0.45:
              boxborderw=18:
              x=(w-text_w)/2:
              y=90,

            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=website.txt:
              fontcolor=white:
              fontsize=45:
              box=1:
              boxcolor=black@0.55:
              boxborderw=15:
              x=(w-text_w)/2:
              y=h-170,

            fps=30
            [video]
            " \
            -map "[video]" \
            -map 1:a \
            -t "$DURATION" \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -ar 24000 \
            -ac 1 \
            -movflags +faststart \
            -shortest \
            main.mp4

      - name: Create video from Pexels photo
        if: env.MEDIA_TYPE == 'image'
        run: |

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i media.jpg \
            -i voice.wav \
            -filter_complex "
            [0:v]
            scale=1200:2134:force_original_aspect_ratio=increase,
            crop=1200:2134,

            zoompan=
              z='min(zoom+0.0005,1.12)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=1:
              s=1080x1920:
              fps=30,

            ass=subtitles.ass,

            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=animal.txt:
              fontcolor=white:
              fontsize=54:
              box=1:
              boxcolor=black@0.45:
              boxborderw=18:
              x=(w-text_w)/2:
              y=90,

            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=website.txt:
              fontcolor=white:
              fontsize=45:
              box=1:
              boxcolor=black@0.55:
              boxborderw=15:
              x=(w-text_w)/2:
              y=h-170

            [video]
            " \
            -map "[video]" \
            -map 1:a \
            -t "$DURATION" \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -ar 24000 \
            -ac 1 \
            -movflags +faststart \
            -shortest \
            main.mp4

      - name: Create InfiniAnimals end screen
        run: |

          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:d=3:r=30" \
            -f lavfi \
            -i "anullsrc=channel_layout=mono:sample_rate=24000" \
            -vf "
            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=cta1.txt:
              fontcolor=white:
              fontsize=54:
              x=(w-text_w)/2:
              y=720,

            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=cta2.txt:
              fontcolor=white:
              fontsize=85:
              x=(w-text_w)/2:
              y=900
            " \
            -t 3 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -c:a aac \
            -ar 24000 \
            -ac 1 \
            end.mp4

      - name: Join video and promotional screen
        run: |

          printf \
            "file 'main.mp4'\nfile 'end.mp4'\n" \
            > files.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i files.txt \
            -c copy \
            -movflags +faststart \
            video.mp4

      - name: Save Pexels attribution
        run: |

          echo "Media source: Pexels" > attribution.txt
          echo "Creator: $CREATOR_NAME" >> attribution.txt
          echo "Source: $PEXELS_PAGE" >> attribution.txt
          echo "Article: $ARTICLE_URL" >> attribution.txt

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: infinianimals-video
          path: |
            video.mp4
            attribution.txt
            subtitles.ass
          retention-days: 1
