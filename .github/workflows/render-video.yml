name: InfiniAnimals Video Renderer

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "WordPress post ID"
        required: true
        type: string

      animal:
        description: "Animal name"
        required: true
        type: string

      script:
        description: "Narration script"
        required: true
        type: string

      article_url:
        description: "InfiniAnimals article URL"
        required: true
        type: string

      youtube_title:
        description: "Video title"
        required: false
        type: string

      media_type:
        description: "video or image"
        required: true
        type: string

      media_url:
        description: "Pexels media URL"
        required: true
        type: string

      creator_name:
        description: "Pexels creator"
        required: false
        type: string

      pexels_page:
        description: "Pexels source page"
        required: false
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    env:
      POST_ID: ${{ inputs.post_id }}
      ANIMAL: ${{ inputs.animal }}
      SCRIPT: ${{ inputs.script }}
      ARTICLE_URL: ${{ inputs.article_url }}
      VIDEO_TITLE: ${{ inputs.youtube_title }}

      MEDIA_TYPE: ${{ inputs.media_type }}
      MEDIA_URL: ${{ inputs.media_url }}

      CREATOR_NAME: ${{ inputs.creator_name }}
      PEXELS_PAGE: ${{ inputs.pexels_page }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
    
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install faster-whisper

      - name: Download Pexels media
        run: |

          echo "Media type: $MEDIA_TYPE"
          echo "Media URL: $MEDIA_URL"

          if [ -z "$MEDIA_URL" ]; then
            echo "No media URL received"
            exit 1
          fi

          if [ "$MEDIA_TYPE" = "video" ]; then

            curl -fL "$MEDIA_URL" -o media.mp4

          elif [ "$MEDIA_TYPE" = "image" ]; then

            curl -fL "$MEDIA_URL" -o media.jpg

          else

            echo "Unsupported media type: $MEDIA_TYPE"
            exit 1

          fi

      - name: Generate narration with Gemini
        run: |

          PROMPT="Narrate this as an energetic, natural wildlife documentary voice for a short social media video.

          Speak clearly and naturally.

          Read the following script exactly:

          $SCRIPT"

          jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "gemini-3.1-flash-tts-preview",
              input: $prompt,
              response_format: {
                type: "audio"
              },
              generation_config: {
                speech_config: [
                  {
                    voice: "Puck"
                  }
                ]
              }
            }' > request.json

          curl -fsS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/interactions" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > response.json

          jq -r \
            '.. | objects |
            select(.type? == "audio" and (.data? != null)) |
            .data' \
            response.json \
            | head -n 1 \
            > audio.b64

          if [ ! -s audio.b64 ]; then
            echo "Gemini did not return audio"
            cat response.json
            exit 1
          fi

          base64 -d audio.b64 > voice.pcm

          ffmpeg -y \
            -f s16le \
            -ar 24000 \
            -ac 1 \
            -i voice.pcm \
            voice.wav

      - name: Generate dynamic subtitles
        run: |
          cat > make_subtitles.py <<'PY'
          from faster_whisper import WhisperModel

          model = WhisperModel(
              "tiny.en",
              device="cpu",
              compute_type="int8"
          )

          segments, _ = model.transcribe(
              "voice.wav",
              language="en",
              word_timestamps=True,
              vad_filter=True
          )

          words = []

          for segment in segments:
              if not segment.words:
                  continue

              for word in segment.words:
                  if word.start is None or word.end is None:
                      continue

                  text = word.word.strip()
                  if not text:
                      continue

                  words.append({
                      "start": float(word.start),
                      "end": float(word.end),
                      "text": text
                  })

          def srt_time(seconds):
              milliseconds = max(0, int(round(seconds * 1000)))

              hours = milliseconds // 3600000
              milliseconds %= 3600000

              minutes = milliseconds // 60000
              milliseconds %= 60000

              secs = milliseconds // 1000
              ms = milliseconds % 1000

              return f"{hours:02d}:{minutes:02d}:{secs:02d},{ms:03d}"

          groups = []
          current = []

          for word in words:
              current.append(word)

              duration = current[-1]["end"] - current[0]["start"]
              text = " ".join(w["text"] for w in current)

              # Short, readable blocks for TikTok/Reels/Shorts.
              if (
                  len(current) >= 4
                  or duration >= 1.8
                  or text.endswith((".", "!", "?"))
              ):
                  groups.append(current)
                  current = []

          if current:
              groups.append(current)

          if not groups:
              raise RuntimeError("Whisper did not generate subtitle timestamps")

          with open("subtitles.srt", "w", encoding="utf-8") as f:
              for i, group in enumerate(groups, start=1):
                  start = group[0]["start"]
                  end = max(group[-1]["end"], start + 0.25)

                  text = " ".join(w["text"] for w in group).upper()
                  text = text.replace("{", "").replace("}", "")

                  f.write(f"{i}\n")
                  f.write(f"{srt_time(start)} --> {srt_time(end)}\n")
                  f.write(text + "\n\n")

          print(f"Created {len(groups)} subtitle blocks")
          PY

          python make_subtitles.py

          echo "=== SUBTITLE PREVIEW ==="
          head -40 subtitles.srt

      - name: Prepare branding
        run: |

          printf '%s\n' "$ANIMAL" > animal.txt

          printf '%s\n' \
            "InfiniAnimals.com" \
            > website.txt

          printf '%s\n' \
            "Read the full animal guide" \
            > cta1.txt

          printf '%s\n' \
            "InfiniAnimals.com" \
            > cta2.txt

      - name: Get narration duration
        run: |

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.wav)

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"

          echo "Narration duration: $DURATION"

      - name: Create video from Pexels clip
        if: env.MEDIA_TYPE == 'video'
        run: |

          ffmpeg -y \
            -stream_loop -1 \
            -i media.mp4 \
            -i voice.wav \
            -filter_complex "
            [0:v]
            scale=1080:1920:force_original_aspect_ratio=increase,
            crop=1080:1920,
            subtitles=subtitles.srt:force_style='FontName=DejaVu Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=4,Shadow=0,Alignment=2,MarginL=90,MarginR=90,MarginV=360,Bold=1',

            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=animal.txt:
              fontcolor=white:
              fontsize=54:
              box=1:
              boxcolor=black@0.45:
              boxborderw=18:
              x=(w-text_w)/2:
              y=90,

            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=website.txt:
              fontcolor=white:
              fontsize=45:
              box=1:
              boxcolor=black@0.55:
              boxborderw=15:
              x=(w-text_w)/2:
              y=h-170,

            fps=30
            [video]
            " \
            -map "[video]" \
            -map 1:a \
            -t "$DURATION" \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -ar 24000 \
            -ac 1 \
            -movflags +faststart \
            -shortest \
            main.mp4

      - name: Create video from Pexels photo
        if: env.MEDIA_TYPE == 'image'
        run: |

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i media.jpg \
            -i voice.wav \
            -filter_complex "
            [0:v]
            scale=1200:2134:force_original_aspect_ratio=increase,
            crop=1200:2134,

            zoompan=
              z='min(zoom+0.0005,1.12)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=1:
              s=1080x1920:
              fps=30,

            subtitles=subtitles.srt:force_style='FontName=DejaVu Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=4,Shadow=0,Alignment=2,MarginL=90,MarginR=90,MarginV=360,Bold=1',

            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=animal.txt:
              fontcolor=white:
              fontsize=54:
              box=1:
              boxcolor=black@0.45:
              boxborderw=18:
              x=(w-text_w)/2:
              y=90,

            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=website.txt:
              fontcolor=white:
              fontsize=45:
              box=1:
              boxcolor=black@0.55:
              boxborderw=15:
              x=(w-text_w)/2:
              y=h-170

            [video]
            " \
            -map "[video]" \
            -map 1:a \
            -t "$DURATION" \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -ar 24000 \
            -ac 1 \
            -movflags +faststart \
            -shortest \
            main.mp4

      - name: Create InfiniAnimals end screen
        run: |

          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:d=3:r=30" \
            -f lavfi \
            -i "anullsrc=channel_layout=mono:sample_rate=24000" \
            -vf "
            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=cta1.txt:
              fontcolor=white:
              fontsize=54:
              x=(w-text_w)/2:
              y=720,

            drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              textfile=cta2.txt:
              fontcolor=white:
              fontsize=85:
              x=(w-text_w)/2:
              y=900
            " \
            -t 3 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -c:a aac \
            -ar 24000 \
            -ac 1 \
            end.mp4

      - name: Join video and promotional screen
        run: |

          printf \
            "file 'main.mp4'\nfile 'end.mp4'\n" \
            > files.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i files.txt \
            -c copy \
            -movflags +faststart \
            video.mp4

      - name: Save Pexels attribution
        run: |

          echo "Media source: Pexels" > attribution.txt
          echo "Creator: $CREATOR_NAME" >> attribution.txt
          echo "Source: $PEXELS_PAGE" >> attribution.txt
          echo "Article: $ARTICLE_URL" >> attribution.txt

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: infinianimals-video
          path: |
            video.mp4
            attribution.txt
          retention-days: 1
