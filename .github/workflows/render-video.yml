name: InfiniAnimals Video Renderer

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "WordPress post ID"
        required: true
        type: string
      animal:
        description: "Animal name"
        required: true
        type: string
      script:
        description: "Narration script"
        required: true
        type: string
      article_url:
        description: "InfiniAnimals article URL"
        required: true
        type: string
      youtube_title:
        description: "Video title"
        required: false
        type: string
      media_type:
        description: "video or image"
        required: true
        type: string
      media_url:
        description: "Fallback Pexels media URL"
        required: true
        type: string
      media_items:
        description: "JSON array with up to 5 media scenes"
        required: false
        type: string
      creator_name:
        description: "Fallback Pexels creator"
        required: false
        type: string
      pexels_page:
        description: "Fallback Pexels source page"
        required: false
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POST_ID: ${{ inputs.post_id }}
      ANIMAL: ${{ inputs.animal }}
      SCRIPT: ${{ inputs.script }}
      ARTICLE_URL: ${{ inputs.article_url }}
      VIDEO_TITLE: ${{ inputs.youtube_title }}
      MEDIA_TYPE: ${{ inputs.media_type }}
      MEDIA_URL: ${{ inputs.media_url }}
      MEDIA_ITEMS: ${{ inputs.media_items }}
      CREATOR_NAME: ${{ inputs.creator_name }}
      PEXELS_PAGE: ${{ inputs.pexels_page }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl fonts-dejavu-core espeak-ng

      - name: Generate narration with Gemini and resilient fallback
        run: |
          set -euo pipefail
          jq -n --arg prompt "Narrate this exactly as written, in an energetic natural English wildlife-documentary voice. Speak clearly and naturally. Script: $SCRIPT" '{
            model: "gemini-3.1-flash-tts-preview",
            input: $prompt,
            response_format: {type: "audio"},
            generation_config: {speech_config: [{voice: "Puck"}]}
          }' > request.json

          SUCCESS=false
          for ATTEMPT in 1 2 3 4 5; do
            echo "Gemini TTS attempt $ATTEMPT/5"
            HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d @request.json || true)
            if [ "$HTTP_CODE" = "200" ]; then
              jq -r '.. | objects | select(.type? == "audio" and (.data? != null)) | .data' response.json | head -n 1 > audio.b64
              if [ -s audio.b64 ]; then
                base64 -d audio.b64 > voice.pcm
                ffmpeg -y -f s16le -ar 24000 -ac 1 -i voice.pcm voice.wav
                SUCCESS=true
                break
              fi
            fi
            WAIT_SECONDS=$((ATTEMPT * 10))
            echo "Gemini returned $HTTP_CODE; retrying in $WAIT_SECONDS seconds"
            sleep "$WAIT_SECONDS"
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Gemini TTS unavailable; using local speech fallback so rendering can finish"
            espeak-ng -v en-us+m3 -s 155 -w voice.wav "$SCRIPT"
          fi

          test -s voice.wav
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice.wav)
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "Narration duration: $DURATION"

      - name: Create timed subtitles
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          script = os.environ["SCRIPT"].strip()
          duration = float(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", "voice.wav"
          ], text=True).strip())
          words = re.findall(r"\S+", script)
          chunks = [words[i:i + 5] for i in range(0, len(words), 5)] or [["InfiniAnimals"]]
          weights = [max(1, sum(len(re.sub(r"\W", "", w)) for w in chunk)) for chunk in chunks]
          total = sum(weights)

          def stamp(value):
              value = max(0.0, value)
              hours = int(value // 3600)
              minutes = int((value % 3600) // 60)
              seconds = value % 60
              return f"{hours:02d}:{minutes:02d}:{seconds:06.3f}".replace(".", ",")

          cursor = 0.0
          with open("subtitles.srt", "w", encoding="utf-8") as handle:
              for index, (chunk, weight) in enumerate(zip(chunks, weights), 1):
                  end = duration if index == len(chunks) else cursor + duration * weight / total
                  handle.write(f"{index}\n{stamp(cursor)} --> {stamp(end)}\n{' '.join(chunk).upper()}\n\n")
                  cursor = end
          PY
          test -s subtitles.srt

      - name: Prepare branding
        run: |
          printf '%s\n' "$ANIMAL" > animal.txt
          printf '%s\n' "InfiniAnimals.com" > website.txt
          printf '%s\n' "Read the full animal guide" > cta1.txt
          printf '%s\n' "InfiniAnimals.com" > cta2.txt

      - name: Download and normalize up to five Pexels scenes
        run: |
          set -euo pipefail
          mkdir -p raw scenes

          if printf '%s' "$MEDIA_ITEMS" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
            printf '%s' "$MEDIA_ITEMS" | jq '.[0:5]' > scenes.json
          else
            jq -n --arg type "$MEDIA_TYPE" --arg url "$MEDIA_URL" \
              --arg creator "$CREATOR_NAME" --arg page "$PEXELS_PAGE" \
              '[{type:$type,url:$url,creator_name:$creator,pexels_page:$page}]' > scenes.json
          fi

          COUNT=$(jq 'length' scenes.json)
          if [ "$COUNT" -lt 1 ]; then
            echo "No usable media received"
            exit 1
          fi

          SEGMENT=$(python3 -c "print(float('$DURATION') / int('$COUNT') + 0.35)")
          : > concat-scenes.txt

          for INDEX in $(seq 0 $((COUNT - 1))); do
            TYPE=$(jq -r ".[$INDEX].type // empty" scenes.json)
            URL=$(jq -r ".[$INDEX].url // empty" scenes.json)
            if [ -z "$URL" ]; then
              echo "Scene $INDEX has no URL"
              exit 1
            fi

            if [ "$TYPE" = "video" ]; then
              curl --retry 3 --retry-all-errors -fL "$URL" -o "raw/$INDEX.mp4"
              ffmpeg -y -stream_loop -1 -i "raw/$INDEX.mp4" -t "$SEGMENT" \
                -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setpts=PTS-STARTPTS" \
                -an -c:v libx264 -preset fast -crf 21 -pix_fmt yuv420p "scenes/$INDEX.mp4"
            elif [ "$TYPE" = "image" ]; then
              curl --retry 3 --retry-all-errors -fL "$URL" -o "raw/$INDEX.jpg"
              ffmpeg -y -loop 1 -framerate 30 -i "raw/$INDEX.jpg" -t "$SEGMENT" \
                -vf "scale=1200:2134:force_original_aspect_ratio=increase,crop=1200:2134,zoompan=z='min(zoom+0.0005,1.12)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,setpts=PTS-STARTPTS" \
                -an -c:v libx264 -preset fast -crf 21 -pix_fmt yuv420p "scenes/$INDEX.mp4"
            else
              echo "Unsupported scene type: $TYPE"
              exit 1
            fi
            printf "file 'scenes/%s.mp4'\n" "$INDEX" >> concat-scenes.txt
          done

          ffmpeg -y -f concat -safe 0 -i concat-scenes.txt -c copy silent-scenes.mp4
          echo "Prepared $COUNT scenes"

      - name: Render narrated multiscene video
        run: |
          ffmpeg -y -i silent-scenes.mp4 -i voice.wav \
            -filter_complex "[0:v]subtitles=subtitles.srt:force_style='FontName=DejaVu Sans,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H000000,BorderStyle=1,Outline=3,Alignment=2,MarginV=320',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=animal.txt:fontcolor=white:fontsize=54:box=1:boxcolor=black@0.45:boxborderw=18:x=(w-text_w)/2:y=90,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=website.txt:fontcolor=white:fontsize=45:box=1:boxcolor=black@0.55:boxborderw=15:x=(w-text_w)/2:y=h-170[video]" \
            -map "[video]" -map 1:a -t "$DURATION" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 24000 -ac 1 -movflags +faststart -shortest main.mp4
          test -s main.mp4

      - name: Create InfiniAnimals end screen
        run: |
          ffmpeg -y -f lavfi -i "color=c=black:s=1080x1920:d=3:r=30" \
            -f lavfi -i "anullsrc=channel_layout=mono:sample_rate=24000" \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=cta1.txt:fontcolor=white:fontsize=54:x=(w-text_w)/2:y=720,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=cta2.txt:fontcolor=white:fontsize=85:x=(w-text_w)/2:y=900" \
            -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 24000 -ac 1 end.mp4

      - name: Join video and promotional screen
        run: |
          printf "file 'main.mp4'\nfile 'end.mp4'\n" > files.txt
          ffmpeg -y -f concat -safe 0 -i files.txt -c copy -movflags +faststart video.mp4
          test -s video.mp4

      - name: Save Pexels attribution
        run: |
          {
            echo "Article: $ARTICLE_URL"
            jq -r '.[] | "Media source: Pexels\nCreator: \(.creator_name // "")\nSource: \(.pexels_page // "")\n"' scenes.json
          } > attribution.txt

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: infinianimals-video
          path: |
            video.mp4
            attribution.txt
            subtitles.srt
            scenes.json
          retention-days: 1
